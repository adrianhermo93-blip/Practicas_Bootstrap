<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio 1 · Plantilla Bootstrap</title>

  <!-- ============================================================
       EJERCICIO 1 · Plantilla inicial
       ============================================================
       PASO 2a: añade aquí la etiqueta <meta name="viewport" ...>
       PASO 2b: añade aquí el <link> al CSS de Bootstrap (CDN)
  -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>

  <!-- PASO 2c: escribe aquí un contenedor con un título, un párrafo y un botón -->
<div class="container mt-5"> 
  <h1>Hola, Bootstrap!</h1>
  <p>Este es un párrafo de ejemplo.</p>
  <button class="btn btn-primary">Botón</button>  
</div>

  <!-- PASO 2d: añade aquí el <script> del JS de Bootstrap (bundle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- PASO 4: comenta el <link> del CSS (Ctrl + /), guarda y observa qué cambia -->
  
  <!-- PASO 5: DevTools (F12) → Network → recarga y busca los archivos de Bootstrap -->

 div class="container mt-5">
  <h2>Variantes de Bootstrap</h2>
  <button class="btn btn-success">Success</button>
  <button class="btn btn-danger">Danger</button>
  <button class="btn btn-warning">Warning</button>
  <button class="btn btn-info">Info</button>
  <button class="btn btn-light">Light</button>
  <button class="btn btn-dark">Dark</button>
  <hr class="my-4">

  <button class=" btn btn-success btn-lg">Botón grande</button>
</div>
<p><a href="../index.html">← Volver al índice</a></p>

</body>
</html>
